<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>基礎断熱・個別空調：最寒週・最暑週の時系列</title><style>body{font:16px/1.6 system-ui,sans-serif;color:#173047;max-width:1450px;margin:24px auto;padding:0 20px}h1{font-size:1.65rem}h2{font-size:1.2rem}nav a{margin-right:1em}label{display:inline-block;margin:.3em .7em .3em 0}select,button{font:inherit;padding:.25em}fieldset{border:1px solid #b9cbd9;border-radius:6px;margin:12px 0} .plot{height:340px} .boxplot{height:400px} .notice{color:#566675} @media(max-width:700px){body{padding:0 8px}.plot{height:320px}}</style><script src="plotly.min.js"></script><script src="weekly_data_g4_cold.js"></script>
<script src="weekly_data_g4_hot.js"></script>
<script src="weekly_data_g5_cold.js"></script>
<script src="weekly_data_g5_hot.js"></script>
<script src="weekly_data_g6_cold.js"></script>
<script src="weekly_data_g6_hot.js"></script>
<script src="weekly_data_g7_cold.js"></script>
<script src="weekly_data_g7_hot.js"></script></head><body><h1>基礎断熱・個別空調：最寒週・最暑週の時系列</h1><nav><a href="annual_report.html">年間集計</a><a href="extreme_weeks.html">週間時系列</a><a href="weekly_room_boxplots.html">箱ひげ図</a></nav><p>24条件から断熱等級・隙間倍率・週を選択できます。外気と主要8室、エアコン4台の合計負荷・消費電力を表示します。</p><label>等級 <select id="grade"></select></label><label>隙間倍率 <select id="gap"></select></label><label>週 <select id="week"><option value="cold">最寒週（2/19～25）</option><option value="hot">最暑週（7/27～8/2）</option></select></label><fieldset><legend>表示室</legend><span id="rooms"></span><button id="all">全選択</button><button id="none">全解除</button></fieldset><p id="info" class="notice"></p><h2>温度</h2><div class="plot" id="temperature"></div><h2>相対湿度</h2><div class="plot" id="relative_humidity"></div><h2>重量絶対湿度</h2><div class="plot" id="absolute_humidity"></div><h2>空調負荷（4台合計）</h2><div class="plot" id="loads"></div><h2>空調消費電力（4台合計）</h2><div class="plot" id="power"></div><script>const grades=[4,5,6,7],mult=['0','0.5','1','2','4','8'],rooms=['外部','LD','和室','寝室','子供室1','子供室2','ホール','洗面所','2階ホール'],colors=['#777777','#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#e377c2','#17becf'],metrics=[['temperature','温度 [℃]'],['relative_humidity','相対湿度 [%]'],['absolute_humidity','重量絶対湿度 [g/kg(DA)]']];const $=id=>document.getElementById(id);const cfg={responsive:true,displaylogo:false};const opt=(values)=>values.map(v=>'<option value="'+v+'">'+v+'</option>').join('');const baseLayout=(y)=>({margin:{l:75,r:20,t:30,b:70},yaxis:{title:y,automargin:true,gridcolor:'#dfe6eb'},xaxis:{gridcolor:'#e7edf1',automargin:true},legend:{orientation:'h',y:1.13},hovermode:'x unified',paper_bgcolor:'#fff',plot_bgcolor:'#fff'});if(!window.WEEKLY_DATA||Object.keys(WEEKLY_DATA).length!==48)throw Error('48週のデータファイルを同じフォルダに置いてください');
$('grade').innerHTML=opt(grades);$('gap').innerHTML=opt(mult);$('gap').value='1';$('rooms').innerHTML=rooms.map((r,i)=>'<label><input type="checkbox" value="'+i+'" checked>'+r+'</label>').join('');function render(){const g=$('grade').value,x=$('gap').value,w=$('week').value,d=WEEKLY_DATA['g'+g+'_x'+x+'_'+w],sel=[...$('rooms').querySelectorAll('input:checked')].map(e=>+e.value);$('info').textContent='等級'+g+'・隙間倍率×'+x+'｜'+d.time[0]+' ～ '+d.time[167]+'（168時間）';function draw(id,items,y){const layout=baseLayout(y);layout.xaxis={...layout.xaxis,type:'category',tickmode:'array',tickvals:d.time.filter((_,i)=>i%24===0),ticktext:d.time.filter((_,i)=>i%24===0).map(t=>t.slice(0,5))};Plotly.react(id,items,layout,cfg)}for(const [m,y] of metrics)draw(m,sel.map(i=>({x:d.time,y:d[m][rooms[i]],name:rooms[i],type:'scatter',mode:'lines',line:{color:colors[i],dash:i===0?'dash':'solid'}})),y);const traces=(pairs)=>pairs.map(([k,n],i)=>({x:d.time,y:d[k],name:n,type:'scatter',mode:'lines',line:{color:colors[i+1]}}));draw('loads',traces([['heating','暖房顕熱'],['cooling_sensible','冷房顕熱'],['cooling_latent','冷房潜熱'],['cooling','冷房合計'],['total','暖冷房合計']]),'熱量 [kWh/h]');draw('power',traces([['heating_electricity','暖房'],['cooling_electricity','冷房'],['electricity','合計']]),'電力量 [kWh/h]')}for(const id of ['grade','gap','week','rooms'])$(id).addEventListener('change',render);for(const [id,v] of [['all',true],['none',false]])$(id).onclick=()=>{$('rooms').querySelectorAll('input').forEach(e=>e.checked=v);render()};render();</script></body></html>
