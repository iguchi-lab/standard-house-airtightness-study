<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>基礎断熱・個別空調：主要8室の週間箱ひげ図</title><style>body{font:16px/1.6 system-ui,sans-serif;color:#173047;max-width:1450px;margin:24px auto;padding:0 20px}h1{font-size:1.65rem}h2{font-size:1.2rem}nav a{margin-right:1em}label{display:inline-block;margin:.3em .7em .3em 0}select,button{font:inherit;padding:.25em}fieldset{border:1px solid #b9cbd9;border-radius:6px;margin:12px 0} .plot{height:340px} .boxplot{height:400px} .notice{color:#566675} @media(max-width:700px){body{padding:0 8px}.plot{height:320px}}</style><script src="plotly.min.js"></script><script src="weekly_data_g4_cold.js"></script>
<script src="weekly_data_g4_hot.js"></script>
<script src="weekly_data_g5_cold.js"></script>
<script src="weekly_data_g5_hot.js"></script>
<script src="weekly_data_g6_cold.js"></script>
<script src="weekly_data_g6_hot.js"></script>
<script src="weekly_data_g7_cold.js"></script>
<script src="weekly_data_g7_hot.js"></script></head><body><h1>基礎断熱・個別空調：主要8室の週間箱ひげ図</h1><nav><a href="annual_report.html">年間集計</a><a href="extreme_weeks.html">週間時系列</a><a href="weekly_room_boxplots.html">箱ひげ図</a></nav><p>各室について、断熱等級4～7 × 隙間6倍率の24条件を横並びで比較します。各箱は168時間のデータから作成します。</p><label>週 <select id="week"><option value="cold">最寒週（2/19～25）</option><option value="hot">最暑週（7/27～8/2）</option></select></label><label>指標 <select id="metric"><option value="temperature">温度</option><option value="relative_humidity">相対湿度</option><option value="absolute_humidity">重量絶対湿度</option></select></label><label><input id="common" type="checkbox" checked>全室で縦軸を統一</label><p class="notice">箱：第1～第3四分位数、中央線：中央値、ひげ：1.5 IQR以内、点：外れ値。色は断熱等級を示します。</p><div id="plots"></div><script>const grades=[4,5,6,7],mult=['0','0.5','1','2','4','8'],rooms=['外部','LD','和室','寝室','子供室1','子供室2','ホール','洗面所','2階ホール'],colors=['#777777','#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#e377c2','#17becf'],metrics=[['temperature','温度 [℃]'],['relative_humidity','相対湿度 [%]'],['absolute_humidity','重量絶対湿度 [g/kg(DA)]']];const $=id=>document.getElementById(id);const cfg={responsive:true,displaylogo:false};const opt=(values)=>values.map(v=>'<option value="'+v+'">'+v+'</option>').join('');const baseLayout=(y)=>({margin:{l:75,r:20,t:30,b:70},yaxis:{title:y,automargin:true,gridcolor:'#dfe6eb'},xaxis:{gridcolor:'#e7edf1',automargin:true},legend:{orientation:'h',y:1.13},hovermode:'x unified',paper_bgcolor:'#fff',plot_bgcolor:'#fff'});if(!window.WEEKLY_DATA||Object.keys(WEEKLY_DATA).length!==48)throw Error('48週のデータファイルを同じフォルダに置いてください');
const indoor=rooms.slice(1),gradeColors=['#2563a6','#d88729','#24886d','#a05296'];$('plots').innerHTML=indoor.map((r,i)=>'<h2>'+r+'</h2><div class="boxplot" id="p'+i+'"></div>').join('');function render(){const w=$('week').value,m=$('metric').value,y=metrics.find(a=>a[0]===m)[1],keys=grades.flatMap(g=>mult.map(x=>'g'+g+'_x'+x+'_'+w)),labels=grades.flatMap(g=>mult.map(x=>'G'+g+'×'+x));let lo=Infinity,hi=-Infinity;for(const r of indoor)for(const k of keys)for(const v of WEEKLY_DATA[k][m][r]){lo=Math.min(lo,v);hi=Math.max(hi,v)}const pad=Math.max((hi-lo)*.05,.1);indoor.forEach((r,i)=>{const traces=keys.map((k,j)=>({type:'box',y:WEEKLY_DATA[k][m][r],name:labels[j],marker:{color:gradeColors[Math.floor(j/6)],size:3},line:{width:1.4},boxpoints:'outliers',quartilemethod:'linear',showlegend:false}));const layout=baseLayout(y);layout.hovermode='closest';layout.xaxis={type:'category',categoryorder:'array',categoryarray:labels,tickangle:-45,automargin:true};if($('common').checked)layout.yaxis.range=[lo-pad,hi+pad];Plotly.react('p'+i,traces,layout,cfg)})}for(const id of ['week','metric','common'])$(id).addEventListener('change',render);render();</script></body></html>
