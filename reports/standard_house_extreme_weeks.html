<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>最寒週・最暑週の標準住宅</title><style>body{max-width:1050px;margin:28px auto;padding:0 16px;font:16px/1.6 system-ui;color:#153547}select{padding:7px;margin:4px}svg{width:100%;height:auto}section{border-top:1px solid #bdcdd2;margin-top:22px}label{display:inline-block;margin-right:10px}.error{color:#9b2c2c}</style><h1>最寒週・最暑週の標準住宅</h1><p>最寒週2月19～25日と最暑週7月27日～8月2日の1時間値。室別温度・相対湿度・絶対湿度と、全館空調の処理熱負荷・消費電力を示す。</p><p>このHTMLは同じリポジトリの検証済み時系列JSONを読み込みます。</p><label>条件<select id=sel></select></label><label>表示室<select id=room><option value="*">外部＋主要8室</option></select></label><main></main><script>const keys=["4_0.5_0219","4_0.5_0727","4_0_0219","4_0_0727","4_1_0219","4_1_0727","4_2_0219","4_2_0727","4_4_0219","4_4_0727","4_8_0219","4_8_0727","5_0.5_0219","5_0.5_0727","5_0_0219","5_0_0727","5_1_0219","5_1_0727","5_2_0219","5_2_0727","5_4_0219","5_4_0727","5_8_0219","5_8_0727","6_0.5_0219","6_0.5_0727","6_0_0219","6_0_0727","6_1_0219","6_1_0727","6_2_0219","6_2_0727","6_4_0219","6_4_0727","6_8_0219","6_8_0727","7_0.5_0219","7_0.5_0727","7_0_0219","7_0_0727","7_1_0219","7_1_0727","7_2_0219","7_2_0727","7_4_0219","7_4_0727","7_8_0219","7_8_0727"];keys.forEach(k=>{const [g,m,w]=k.split('_');sel.add(new Option('等級'+g+'　×'+m+'　'+(w==='0219'?'最寒週 2/19–2/25':'最暑週 7/27–8/2'),k))});sel.value='4_1_0219';let names=[];async function render(){const main=document.querySelector('main');main.innerHTML='<p>読み込み中…</p>';try{const data=await fetch('../data/extreme-weeks/'+sel.value+'.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()});const current=["外部", "LD", "和室", "寝室", "子供室1", "子供室2", "ホール", "洗面所", "2階ホール"];if(names.join()!==current.join()){names=current;room.innerHTML='<option value="*">外部＋主要8室</option>';names.forEach(n=>room.add(new Option(n,n)))}main.innerHTML='';for(const [label,d] of Object.entries(data)){const lines=Object.hasOwn(d,'外部')?names.filter(k=>room.value==='*'||room.value===k||k==='外部').map(k=>[k,d[k]]):Object.entries(d);let lo=Math.floor(Math.min(...lines.flatMap(z=>z[1]))),hi=Math.ceil(Math.max(...lines.flatMap(z=>z[1])));if(hi<=lo)hi=lo+1;let svg='',legend='';for(let j=0;j<5;j++){let y=15+44*j;svg+='<path stroke="#d5dce0" d="M48 '+y+'H977"/><text x="42" y="'+(y+5)+'" text-anchor="end">'+(hi-(hi-lo)*j/4).toFixed(1)+'</text>'}lines.forEach(([k,a],i)=>{let ix=names.includes(k)?names.indexOf(k):i,c='hsl('+((ix*137)%360)+' 62% 38%)';let points=a.map((v,j)=>(48+j*929/167)+','+(15+176*(hi-v)/(hi-lo))).join(' ');svg+='<polyline points="'+points+'" fill="none" stroke="'+c+'" stroke-width="1.8"/>';legend+='<label style="color:'+c+'">━ '+k+'</label>'});for(let day=0;day<7;day++){let dt=new Date(Date.UTC(2026,sel.value.endsWith('0219')?1:6,(sel.value.endsWith('0219')?19:27)+day));svg+='<text x="'+(48+day*24*929/167)+'" y="215">'+(dt.getUTCMonth()+1)+'/'+dt.getUTCDate()+'</text>'}main.insertAdjacentHTML('beforeend','<section><h2>'+label+'</h2><svg viewBox="0 0 1000 225">'+svg+'</svg>'+legend+'</section>')}}catch(e){main.innerHTML='<p class="error">時系列データを読み込めませんでした。リポジトリをWebサーバー経由で開いてください。</p>'}}sel.onchange=room.onchange=render;render()</script></html>
